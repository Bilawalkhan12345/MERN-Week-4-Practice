<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="todoProj.css">
</head>
<body>
    <div class="container">
     <h1>My To-Do App</h1>

     <!--Input field and add button-->

     <div class="input-box">

        <!-- User types tasks here  -->
        <input type="text" placeholder="Add a new task" id="taskInput">

        <!-- Button to add the task to the list -->
        <button id="addBtn">Add Task</button>
     </div>



     <ul id="taskList">
        <!-- Tasks will be dynamically added here -->
     </ul>

    </div>


    <!-- Linking the JavaScript file to handle the functionality of the to-do list -->
    <script src="todoProj.js"></script>
</body>
</html>
