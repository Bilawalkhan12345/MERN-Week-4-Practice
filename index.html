<!-- Example of save in local storage in JavaScript: (frontend or browser storage)

Here is an example of how to save data in local storage using JavaScript: -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Local Storage Example</h1>

    <button onclick="saveData()">Save Name</button>


    <!-- // Example of saving an object in local storage -->

    <script>
        function saveData() {
            // Get the name from the user
            const name = localStorage.getItem("userName");

            // Save the name in local storage
            localStorage.setItem("userName", "Bilawal");

            alert("Name saved in local storage!");
        }
    </script>
